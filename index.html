<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05061a">
<title>Nova Tether</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305061a'/%3E%3Cpath d='M2 6h7l3 2-3 2H2z' fill='%233d5afe'/%3E%3Ccircle cx='13' cy='8' r='2.5' fill='%23ff8a1f'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas#game{image-rendering:pixelated;image-rendering:crisp-edges;background:#05061a;display:block}
  #touch{position:fixed;inset:0;display:none;pointer-events:none}
  #touch.on{display:block}
  .tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
        font:bold 15px "Courier New",monospace;color:#fff;letter-spacing:1px;text-shadow:0 0 4px #000;
        border:3px solid rgba(255,255,255,.45);box-sizing:border-box;opacity:.5}
  .tbtn.down{opacity:.85;transform:scale(.94)}
  #bFire{width:96px;height:96px;right:calc(18px + env(safe-area-inset-right));bottom:44px;background:rgba(255,46,136,.45)}
  #bForce{width:70px;height:70px;right:calc(126px + env(safe-area-inset-right));bottom:70px;background:rgba(255,138,31,.45)}
  .small{width:44px!important;height:44px!important;font-size:12px!important;background:rgba(31,42,107,.6)}
  #bPause{left:calc(50% + 120px);top:6px}
  #bMute{left:calc(50% + 170px);top:6px}
  #bFs{left:calc(50% + 220px);top:6px}
  #fsDesk{position:fixed;right:10px;bottom:46px;font:bold 12px 'Courier New',monospace;color:#b388ff;background:rgba(5,6,26,.5);border:1px solid #6a3dbf;padding:4px 8px;cursor:pointer;opacity:.6;z-index:4}
  body.touch #fsDesk{display:none}
  #stickBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(179,136,255,.5);background:rgba(31,42,107,.25);display:none}
  #stickKnob{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(179,136,255,.6);border:2px solid #fff;display:none}
  #rotate{position:fixed;left:0;right:0;top:0;padding:10px;text-align:center;font:bold 14px "Courier New",monospace;color:#ffd23f;background:rgba(5,6,26,.85);display:none;z-index:5}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="touch">
  <div id="stickBase"></div><div id="stickKnob"></div>
  <div class="tbtn" id="bFire">FIRE</div>
  <div class="tbtn" id="bForce">FORCE</div>
  <div class="tbtn small" id="bPause">II</div>
  <div class="tbtn small" id="bMute">SND</div>
  <div class="tbtn small" id="bFs">[ ]</div>
</div>
<div id="fsDesk" title="Fullscreen (F)">&#x26F6; FULLSCREEN</div>
<div id="rotate">&#8635; Rotate your phone to landscape for the best view</div>
<script>
/* =====================================================================
   NOVA TETHER  —  a horizontal shoot-'em-up with a detachable Force pod
   Single file, vanilla JS + Canvas 2D, no external assets.

   SECTIONS (search for the banners):
     0. CONFIG & UTILITIES        6. PROJECTILES (player + enemy)
     1. AUDIO (WebAudio sfx)      7. ENEMIES (types + patterns)  <- add enemy types here
     2. INPUT (keys + touch)      8. BOSSES (mini, stage bosses)
     3. SPRITES / PALETTE         9. POWER-UPS
     4. BACKGROUND (parallax)    10. STAGES / TIMELINE           <- add stages here
     5. PLAYER & FORCE           11. GAME LOOP, HUD, SCREENS, DEBUG API
   The simulation runs on a fixed 1/60 s step (deterministic); every
   movement is velocity * DT so tuning is in pixels-per-second.
   ===================================================================== */
'use strict';

/* ===================== 0. CONFIG & UTILITIES ===================== */
let W = 960; const H = 540, DT = 1 / 60;
let ZONE_X = W * 0.40;                 // player may roam the left 40%
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const PAL = { deep:'#05061a', navy:'#0b0b2e', blue:'#1f2a6b', blue2:'#3d5afe', purple:'#6a3dbf',
  lav:'#b388ff', pink:'#ff2e88', orange:'#ff8a1f', yellow:'#ffd23f', white:'#f4f1ff', cyan:'#5ee7ff', red:'#ff3b3b' };
let seed = 1;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const rr = (a, b) => a + rnd() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const hit = (a, b, r) => dist2(a.x, a.y, b.x, b.y) < r * r;
const HI_KEY = 'novaTetherHi';
let hiScore = +(localStorage.getItem(HI_KEY) || 0);

/* ===================== 1. AUDIO ===================== */
const Audio = {
  ac: null, muted: localStorage.getItem('novaTetherMute') === '1', master: null, chargeOsc: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.35; this.master.connect(this.ac.destination);
    } catch (e) { this.ac = null; }
  },
  toggle() { this.muted = !this.muted; localStorage.setItem('novaTetherMute', this.muted ? '1' : '0'); if (this.master) this.master.gain.value = this.muted ? 0 : 0.35; },
  tone(f0, f1, dur, type = 'square', vol = 0.2) {
    if (!this.ac || this.muted || NV.manual) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.3, hp = 400) {
    if (!this.ac || this.muted || NV.manual) return;
    const t = this.ac.currentTime, n = Math.floor(this.ac.sampleRate * dur), b = this.ac.createBuffer(1, n, this.ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ac.createBufferSource(), g = this.ac.createGain(), f = this.ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = hp * 4; s.buffer = b; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  shoot() { this.tone(1400, 700, 0.05, 'square', 0.05); },
  beam(c) { this.tone(180 + c * 200, 60, 0.45, 'sawtooth', 0.25); this.noise(0.3, 0.15); },
  boom(big) { this.noise(big ? 0.9 : 0.3, big ? 0.5 : 0.25, big ? 150 : 400); },
  power() { this.tone(500, 1600, 0.25, 'triangle', 0.25); },
  force() { this.tone(300, 900, 0.12, 'triangle', 0.18); },
  hurt() { this.tone(400, 50, 0.6, 'sawtooth', 0.3); this.noise(0.6, 0.4); },
};

/* ===================== 2. INPUT ===================== */
const Input = { up:0, down:0, left:0, right:0, fire:false, forcePressed:false, pausePressed:false, startPressed:false, sx:0, sy:0 };
const keyMap = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
addEventListener('keydown', e => {
  Audio.init();
  if (keyMap[e.code]) { Input[keyMap[e.code]] = 1; e.preventDefault(); }
  if (e.code === 'Space') { if (!Input.fire) Input.startPressed = true; Input.fire = true; e.preventDefault(); }
  if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyZ') && !e.repeat) Input.forcePressed = true;
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) Input.pausePressed = true;
  if (e.code === 'Enter' && !e.repeat) Input.startPressed = true;
  if (e.code === 'KeyM' && !e.repeat) Audio.toggle();
});
addEventListener('keyup', e => { if (keyMap[e.code]) Input[keyMap[e.code]] = 0; if (e.code === 'Space') Input.fire = false; });
addEventListener('blur', () => { Object.assign(Input, { up:0, down:0, left:0, right:0, fire:false }); if (G.mode === 'play') G.mode = 'pause'; });

// ---- touch: floating joystick on the left half, buttons on the right ----
const T = { el: document.getElementById('touch'), stickId: null, ox: 0, oy: 0,
  base: document.getElementById('stickBase'), knob: document.getElementById('stickKnob') };
function enableTouch() { T.el.classList.add('on'); document.body.classList.add('touch'); }
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) enableTouch();
function btn(id, down, up) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); Audio.init(); el.classList.add('down'); down(); }, { passive:false });
  const end = e => { e.preventDefault(); el.classList.remove('down'); up && up(); };
  el.addEventListener('touchend', end, { passive:false }); el.addEventListener('touchcancel', end, { passive:false });
}
btn('bFire', () => { if (!Input.fire) Input.startPressed = true; Input.fire = true; }, () => { Input.fire = false; });
btn('bForce', () => { Input.forcePressed = true; });
btn('bPause', () => { Input.pausePressed = true; });
btn('bMute', () => { Audio.toggle(); });
// ---- optional fullscreen: button, F key, and first tap on mobile ----
function toggleFs() { const d = document, el = d.documentElement;
  try { if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const r = el.requestFullscreen || el.webkitRequestFullscreen; if (r) { const p = r.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {});
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } } } catch (e) {} }
let fsTried = false;
document.addEventListener('touchend', () => { if (!fsTried) { fsTried = true; if (!(document.fullscreenElement || document.webkitFullscreenElement)) toggleFs(); } });
btn('bFs', () => { fsTried = true; toggleFs(); });
document.getElementById('fsDesk').addEventListener('click', toggleFs);
addEventListener('keydown', e => { if (e.code === 'KeyF') toggleFs(); });
document.addEventListener('fullscreenchange', resize);
document.addEventListener('touchstart', e => {
  enableTouch(); Audio.init();
  for (const t of e.changedTouches) {
    if (G.mode !== 'play') { Input.startPressed = true; continue; }
    if (T.stickId === null && t.clientX < innerWidth * 0.55) {
      T.stickId = t.identifier; T.ox = t.clientX; T.oy = t.clientY;
      T.base.style.cssText = `display:block;left:${T.ox}px;top:${T.oy}px`;
      T.knob.style.cssText = `display:block;left:${T.ox}px;top:${T.oy}px`;
    }
  }
  e.preventDefault();
}, { passive:false });
document.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) if (t.identifier === T.stickId) {
    let dx = t.clientX - T.ox, dy = t.clientY - T.oy; const m = Math.hypot(dx, dy), R = 50;
    if (m > R) { dx *= R / m; dy *= R / m; }
    Input.sx = Math.abs(dx) > 6 ? dx / R : 0; Input.sy = Math.abs(dy) > 6 ? dy / R : 0;
    T.knob.style.left = (T.ox + dx) + 'px'; T.knob.style.top = (T.oy + dy) + 'px';
  }
  e.preventDefault();
}, { passive:false });
function stickEnd(e) { for (const t of e.changedTouches) if (t.identifier === T.stickId) {
  T.stickId = null; Input.sx = Input.sy = 0; T.base.style.display = T.knob.style.display = 'none'; } }
document.addEventListener('touchend', stickEnd); document.addEventListener('touchcancel', stickEnd);
cv.addEventListener('mousedown', () => { Audio.init(); if (G.mode !== 'play') Input.startPressed = true; });

// ---- responsive letterbox ----
// Adaptive logical view: height fixed at 540, width follows the window aspect (960..1200).
let SC = 1;
function resize() {
  const vw = innerWidth, vh = innerHeight;
  W = Math.round(clamp(H * vw / vh, 960, 1200)); ZONE_X = W * 0.40; try { HUD_BAR = null; } catch (e) {}
  const s = Math.min(vw / W, vh / H), cw = Math.ceil(W * s), ch = Math.ceil(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = Math.min(devicePixelRatio || 1, 2), bs = Math.min(cw * dpr, 2400) / W;   // crisp, but capped for phone fps
  SC = Math.max(1, bs); cv.width = Math.round(W * SC); cv.height = Math.round(H * SC); ctx.imageSmoothingEnabled = false;
  document.getElementById('rotate').style.display = innerHeight > innerWidth * 1.1 ? 'block' : 'none';
}
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', resize); resize();

/* ===================== 3. SPRITES / PALETTE ===================== */
// Pixel maps: each char is a palette colour, '.' is transparent.
const CH = { a:PAL.navy, b:PAL.blue, c:PAL.blue2, d:PAL.purple, e:PAL.lav, p:PAL.pink, o:PAL.orange, y:PAL.yellow, w:PAL.white, k:'#000', r:PAL.red, g:PAL.cyan,
  f:'#141a45', h:'#8fa8ff', q:'#3a1f6e', m:'#a3195b', n:'#b3530f', s:'#2a3a9a', t:'#5a2a8a' };   // shades for pixel shading
function sprite(rows, s = 3) {
  const w = Math.max(...rows.map(r => r.length)), c = document.createElement('canvas');
  c.width = w * s; c.height = rows.length * s; const x = c.getContext('2d');
  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (CH[ch]) { x.fillStyle = CH[ch]; x.fillRect(i * s, j * s, s, s); } }));
  return c;
}
function flipH(src) { const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c; }
function whiteOf(src) { const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;   // hit-flash silhouette
  const x = c.getContext('2d'); x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); return c; }
// ---- glow sprites: pre-rendered radial gradients, drawn additively (cheap on phones) ----
const vr = Math.random;            // visual-only randomness, keeps the gameplay RNG deterministic
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const glowCache = {};
function glow(col, r) { r = Math.max(4, r | 0); const k = col + r;
  return glowCache[k] || (glowCache[k] = makeCanvas(r * 2, r * 2, x => { const g = x.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0, hexA(col, 0.9)); g.addColorStop(0.3, hexA(col, 0.45)); g.addColorStop(1, hexA(col, 0)); x.fillStyle = g; x.fillRect(0, 0, r * 2, r * 2); })); }
function drawGlow(x, y, col, r, a = 1) { if (G.lowFx && r < 30) return; const q = Math.round(r / 4) * 4, s = glow(col, q);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(a, 0, 1); ctx.drawImage(s, x - q, y - q);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
const frames = (...rowsList) => rowsList.map(r => sprite(r));
const SPR = {
  ship: sprite([
    '......ffff..............',
    '.....fssssff............',
    '....fshhsssbff..........',
    '...fbccccccccbbff.......',
    '..fqdddddsccchhccbf.....',
    'nnfqmmmmdscggwwccccwwe..',
    '..fqdddddscccccccbbf....',
    '...fbccccccccbbff.......',
    '....fsddssbbff..........',
    '.....fffff..............']),
  claw: sprite(['.mpp', 'mppy', 'mppy', '.mpp'], 3),
  drone: frames([
    '.eeeeeeeeee.', '.....ww.....', '....qqqq....', '..qqddddqq..', '.qdtdeedtdq.', 'qdepmyympedq',
    'qdepmyympedq', '.qdtdeedtdq.', '..qqddddqq..', '....qqqq....', '.....ww.....', '.eeeeeeeeee.'], [
    '....eeee....', '.....ww.....', '....qqqq....', '..qqddddqq..', '.qdtdeedtdq.', 'qdepmrrmpedq',
    'qdepmrrmpedq', '.qdtdeedtdq.', '..qqddddqq..', '....qqqq....', '.....ww.....', '....eeee....']),
  darter: frames([
    '....nnoo........', '...noyyooooqq...', '..npwwppppdqqf..', 'mppppppppppdqqoy', '..npppppppdqqf..', '...noyyooooqq...', '....nnoo........'], [
    '....nnoo........', '...noyyooooqq...', '..npwwppppdqqf..', 'mppppppppppdqqyw', '..npppppppdqqf..', '...noyyooooqq...', '....nnoo........']),
  wing: frames([
    '.....cc.....', '....cbbc....', '...cbbbbc...', '..cbhhbbbcff', 'pcbwwgbbqqff', 'pcbwwgbbqqff', '..cbbbbbbcff', '...cbbbbc...', '....cbbc....', '.....cc.....'], [
    '............', '............', '...cbbbbc...', '..cbhhbbbcf.', 'pcbwwgbbqqf.', 'pcbwwgbbqqf.', '..cbbbbbbcf.', '...cbbbbc...', '............', '............']),
  hunter: frames([
    '....qqqqqq....', '..qqddddddqq..', '.qdeeehheeedq.', 'qpppdeeeeeeddq', 'pwyypdeeeedddq', 'qpppdeeeeeeddq', '.qdeeeeeeeedq.', '..qqddddddqq..', '....qqqqqq....'], [
    '....qqqqqq....', '..qqddddddqq..', '.qdeeehheeedq.', 'qpppdeeeeeeddq', 'pwrrpdeeeedddq', 'qpppdeeeeeeddq', '.qdeeeeeeeedq.', '..qqddddddqq..', '....qqqqqq....']),
  carrier: frames([
    '...ffffffffff...', '..fbsssssssssbf.', '.fbddddddddddbf.', 'fbdeeeeeeeeeedbf', 'fbdeyyyyyyyyedbf', 'fbdeyoowwooyedbf',
    'fbdeyyyyyyyyedbf', 'fbdeeeeeeeeeedbf', '.fbddddddddddbf.', '..fbsssssssssbf.', '...ffffffffff...'], [
    '...ffffffffff...', '..fbsssssssssbf.', '.fbddddddddddbf.', 'fbdeeeeeeeeeedbf', 'fbdeooooooooedbf', 'fbdeoyywwyyoedbf',
    'fbdeooooooooedbf', 'fbdeeeeeeeeeedbf', '.fbddddddddddbf.', '..fbsssssssssbf.', '...ffffffffff...']),
  turretBase: sprite(['..ffffffffff..', '.fssssssssssf.', 'fsbbbbbbbbbbsf', 'fbqqbbbbbbqqbf', 'ffffffffffffff'], 3),
};
for (const k of ['drone', 'darter', 'wing', 'hunter', 'carrier']) SPR[k + 'W'] = SPR[k].map(whiteOf);
SPR.lifeIcon = sprite(['..ff.....', '.fssf....', 'nfcccghw.', '.fssf....', '..ff.....'], 2);
// Force pod shell (shaded orb with dark socket), rendered once
SPR.pod = pixelate(makeCanvas(40, 40, x => { const g = x.createRadialGradient(15, 14, 2, 20, 20, 18);
  g.addColorStop(0, '#ffe08a'); g.addColorStop(0.45, PAL.orange); g.addColorStop(0.85, '#b3530f'); g.addColorStop(1, '#5a1f08');
  x.fillStyle = g; x.beginPath(); x.arc(20, 20, 16, 0, 7); x.fill();
  x.fillStyle = '#2a0a12'; x.beginPath(); x.arc(20, 20, 9, 0, 7); x.fill();
  x.strokeStyle = '#ffd23f'; x.lineWidth = 2; x.beginPath(); x.arc(20, 20, 13, 3.6, 5.4); x.stroke(); }), 2);

/* ===================== 4. BACKGROUND (parallax) ===================== */
// Each stage theme draws 3+ layers: far (nebula/stars), mid (structures), fore (debris drawn over the action).
function makeCanvas(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
function pixelate(src, f) { // downscale+upscale for a chunky pixel look
  const s = makeCanvas(src.width / f | 0, src.height / f | 0, (x, w, h) => x.drawImage(src, 0, 0, w, h));
  return makeCanvas(src.width, src.height, x => { x.imageSmoothingEnabled = false; x.drawImage(s, 0, 0, src.width, src.height); });
}
function nebula(cols, n, s) { seed = s;
  return pixelate(makeCanvas(W, H, (x) => { for (let i = 0; i < n; i++) {
    const cx = rr(0, W), cy = rr(0, H), r = rr(80, 260), g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, cols[i % cols.length]); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g;
    for (const ox of [-W, 0, W]) { x.save(); x.translate(ox, 0); x.fillRect(cx - r, cy - r, r * 2, r * 2); x.restore(); } } }), 6);
}
function stationStrip() { seed = 77; const lights = [];   // shaded girders top & bottom with braces, windows and lamp sockets
  const c = makeCanvas(1920, H, (x) => {
    for (let px = 0; px < 1920; px += 48) {
      const th = 26 + (rnd() * 4 | 0) * 16, bh = 26 + (rnd() * 4 | 0) * 16;
      for (const [y0, h, top] of [[0, th, 1], [H - bh, bh, 0]]) {
        const g = x.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, top ? '#0d1236' : '#2a3a9a'); g.addColorStop(1, top ? '#2a3a9a' : '#0d1236');
        x.fillStyle = '#0a0d2a'; x.fillRect(px, y0, 48, h); x.fillStyle = g; x.fillRect(px + 2, y0 + 2, 44, h - 4);
        x.fillStyle = '#0b0b2e'; for (let k = 8; k < h - 8; k += 14) x.fillRect(px + 6, y0 + k, 36, 3);
        x.fillStyle = '#5a6fd8'; x.fillRect(px + 2, top ? y0 + h - 4 : y0 + 2, 44, 2);              // lit edge

    [11, () => WAVES.hunters(3)], [14, () => WAVES.formation(7, 130, 1)], [15, () => WAVES.formation(7, 410, -1)], [18, WAVES.carrier],
    [20, () => WAVES.turrets(6)], [23, () => WAVES.dive(8)], [27, 'MINI'], [28, WAVES.carrier], [30, () => WAVES.hunters(4)],
    [33, () => { WAVES.sine(6, 200); WAVES.formation(6, 400, -1); }], [37, () => WAVES.dive(8)], [40, WAVES.carrier],
    [42, () => { WAVES.turrets(4); WAVES.hunters(2); }], [46, () => WAVES.sine(8, 270)], [49, WAVES.carrier], [53, 'BOSS'] ],
    mini: () => makeWarden(1.6), boss: makeHiveMother },

/* ===================== 11. GAME LOOP, HUD, SCREENS ===================== */
const G = { mode: 'title', stage: 0, loop: 0, time: 0, stageT: 0, evIdx: 0, score: 0, lives: 3, frame: 0, shake: 0, scroll: 90,
  diff: 1, speedMul: 1, flash: 0, lowFx: false, orbIdx: 0, toast: null, banner: null, modeT: 0, bossKills: 0, extendAt: 50000 };
function addScore(n) { G.score += n; if (G.score >= G.extendAt) { G.extendAt += 80000; G.lives++; G.toast = { text: '1UP!', t: 1.5 }; }
  if (G.score > hiScore) { hiScore = G.score; localStorage.setItem(HI_KEY, hiScore); } }
function clearWorld() { for (const a of [enemies, pshots, ebullets, missiles, beams, orbs, bosses, parts, rings, flashes]) a.length = 0; }
function startStage(i) {
  G.stage = i; G.stageT = 0; G.evIdx = 0; clearWorld(); G.diff = 1 + G.loop * 0.35 + i * 0.1;
  G.banner = { text: 'STAGE ' + (i + 1) + ' - ' + BG.themes[STAGES[i].theme].name, t: 2.5 };
  if (!P.alive) spawnPlayer(); else { P.x = 120; P.y = H / 2; P.inv = 1.5; F.state = 'front'; F.x = P.x + 40; F.y = P.y; }
}
function newGame() { seed = 12345; G.score = 0; G.lives = 3; G.loop = 0; G.orbIdx = 0; G.bossKills = 0; G.extendAt = 50000;
  Object.assign(P, { weapon: 'L', level: 1 }); spawnPlayer(); P.inv = 1.5; G.mode = 'play'; G.modeT = 0; startStage(0); }
function gameOver() { G.mode = 'over'; G.modeT = 0; if (G.score > hiScore) hiScore = G.score; localStorage.setItem(HI_KEY, hiScore); }
function stageClear() { G.mode = 'clear'; G.modeT = 0; addScore(10000 * (G.stage + 1)); }
function stageStep() {
  const st = STAGES[G.stage];
  if (bosses.length === 0) G.stageT += DT;
  while (G.evIdx < st.events.length && st.events[G.evIdx][0] <= G.stageT) {
    const ev = st.events[G.evIdx++][1];
    if (ev === 'MINI') { bosses.push(st.mini()); G.banner = { text: 'WARNING: WARDEN APPROACHING', t: 2 }; }
    else if (ev === 'BOSS') { bosses.push(st.boss()); G.banner = { text: 'WARNING: ' + bosses[bosses.length - 1].name, t: 2.5 }; }
    else ev();
  }
}
function step() {   // one fixed 1/60 s simulation tick
  G.frame++; G.modeT += DT;
  if (Input.pausePressed) { Input.pausePressed = false; if (G.mode === 'play') G.mode = 'pause'; else if (G.mode === 'pause') G.mode = 'play'; }
  const sp = Input.startPressed; Input.startPressed = false;
  if (G.mode === 'pause') { if (sp) G.mode = 'play'; Input.forcePressed = false; return; }
  BG.update(G.scroll * G.speedMul);
  if (G.mode === 'title') { if (sp) newGame(); Input.forcePressed = false; updateParts(); return; }
  if (G.mode === 'over') { updateParts(); updateProjectiles(); updateEnemies(); updateBosses(); if (sp && G.modeT > 1) newGame(); Input.forcePressed = false; return; }
  if (G.mode === 'clear') { updateParts(); G.speedMul = G.modeT > 1.5 ? 3 : 1; if (G.modeT > 4) { G.speedMul = 1;
      if (G.stage + 1 < STAGES.length) startStage(G.stage + 1); else { G.loop++; startStage(0); G.banner = { text: 'LOOP ' + (G.loop + 1) + ' - HARDER!', t: 2.5 }; } G.mode = 'play'; }
    return; }
  // ---- play ----
  G.time += DT;
  if (Input.forcePressed) { Input.forcePressed = false; forceToggle(); }
  stageStep(); updatePlayer(); updateForce(); updateEnemies(); updateBosses(); updateProjectiles(); updateOrbs(); updateParts();
  for (let i = bosses.length - 1; i >= 0; i--) if (bosses[i].dead) bosses.splice(i, 1);
  if (G.toast) { G.toast.t -= DT; if (G.toast.t <= 0) G.toast = null; }
  if (G.banner) { G.banner.t -= DT; if (G.banner.t <= 0) G.banner = null; }
  G.shake = Math.max(0, G.shake - DT * 30); G.flash = Math.max(0, G.flash - DT);
}
function text(s, x, y, size, col, align = 'center') { ctx.font = `bold ${size}px "Courier New",monospace`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 2, y + 2); ctx.fillStyle = col; ctx.fillText(s, x, y); }
let HUD_BAR = null;
function hudBar() { return HUD_BAR || (HUD_BAR = makeCanvas(W, 34, x => { const g = x.createLinearGradient(0, 0, 0, 34);
  g.addColorStop(0, 'rgba(31,42,107,.92)'); g.addColorStop(1, 'rgba(5,6,26,.95)'); x.fillStyle = g; x.fillRect(0, 0, W, 34);
  x.fillStyle = PAL.lav; x.fillRect(0, 0, W, 2); x.fillStyle = PAL.pink; x.fillRect(0, 2, W, 1);
  x.fillStyle = 'rgba(179,136,255,.25)'; for (const sx of [300, 680]) x.fillRect(sx, 6, 2, 24);
  x.fillStyle = '#070920'; x.fillRect(382, 9, 264, 18); x.strokeStyle = PAL.lav; x.strokeRect(381.5, 8.5, 265, 19); })); }
function drawHUD() {
  ctx.fillStyle = 'rgba(5,6,26,.55)'; ctx.fillRect(6, 6, 220, 26); ctx.fillRect(W / 2 - 100, 6, 200, 26);
  text('SCORE ' + String(G.score).padStart(7, '0'), 14, 19, 18, PAL.white, 'left');
  text('HI ' + String(hiScore).padStart(7, '0'), W / 2, 19, 18, PAL.yellow);
  for (let i = 0; i < Math.min(G.lives, 8); i++) ctx.drawImage(SPR.lifeIcon, W - 32 - i * 22, 12);
  // bottom bar: weapon, beam charge meter (segmented), force state
  const by = H - 34; ctx.drawImage(hudBar(), 0, by);
  const wc = ORB_COL[P.weapon]; drawGlow(24, by + 18, wc, 14, 0.6); ctx.fillStyle = wc; ctx.beginPath(); ctx.arc(24, by + 18, 8, 0, 7); ctx.fill();
  ctx.fillStyle = PAL.navy; ctx.font = 'bold 11px "Courier New",monospace'; ctx.textAlign = 'center'; ctx.fillText(P.weapon, 24, by + 19);
  text(ORB_NAME[P.weapon], 40, by + 18, 15, wc, 'left');
  for (let i = 0; i < 3; i++) { ctx.fillStyle = i < P.level ? wc : '#2a2f6b'; ctx.fillRect(200 + i * 18, by + 12, 13, 12); }
  text('BEAM', 330, by + 18, 15, PAL.lav, 'left');
  const segs = 26, filled = Math.floor(P.charge * segs + 0.001);
  for (let i = 0; i < segs; i++) { const on = i < filled; ctx.fillStyle = !on ? (i < 8 ? '#141a45' : '#1a2050') : P.charge >= 1 ? (G.frame % 8 < 4 ? PAL.white : PAL.pink) : i < 8 ? PAL.blue2 : PAL.cyan;
    ctx.fillRect(385 + i * 10, by + 12, 8, 12); }
  if (P.charge >= 1) drawGlow(645, by + 18, PAL.pink, 20, 0.8);
  ctx.drawImage(SPR.pod, W - 214, by + 6, 24, 24);
  text(F.state.toUpperCase(), W - 14, by + 18, 15, PAL.orange, 'right'); text('FORCE', W - 120, by + 18, 12, '#b98a60', 'right');
  if (bosses.length) { const b = bosses[0], f = Math.max(0, b.hp / b.maxHp); text(b.name, W / 2, 44, 14, PAL.pink);
    ctx.fillStyle = '#070920'; ctx.fillRect(W / 2 - 152, 53, 304, 10); ctx.strokeStyle = PAL.pink; ctx.strokeRect(W / 2 - 152.5, 52.5, 305, 11);
    const g = ctx.createLinearGradient(W / 2 - 150, 0, W / 2 + 150, 0); g.addColorStop(0, PAL.orange); g.addColorStop(1, PAL.pink);
    ctx.fillStyle = g; ctx.fillRect(W / 2 - 150, 55, 300 * f, 6); ctx.fillStyle = '#070920'; for (const m of [1 / 3, 2 / 3]) ctx.fillRect(W / 2 - 150 + 300 * m, 53, 2, 10); }
  if (G.toast) text(G.toast.text, P.x + 10, P.y - 36, 16, PAL.yellow);
  if (G.banner) drawBanner(G.banner);
  if (Audio.muted) text('MUTED (M)', W - 14, 44, 12, PAL.lav, 'right');
}
function drawBanner(bn) {   // sliding band banner for stage intros, warnings and phase changes
  const warn = bn.text.startsWith('WARN'), age = (bn.max || (bn.max = bn.t)) - bn.t, k = Math.min(1, age * 4, bn.t * 4), y = H / 2 - 120;
  const col = warn ? (G.frame % 20 < 10 ? PAL.pink : PAL.orange) : PAL.white;
  ctx.globalAlpha = 0.8 * k; ctx.fillStyle = warn ? '#3a0820' : '#0b0b2e'; ctx.fillRect(0, y - 26 * k, W, 52 * k);
  ctx.fillStyle = warn ? PAL.pink : PAL.lav; ctx.fillRect(0, y - 26 * k, W, 2); ctx.fillRect(0, y + 26 * k - 2, W, 2);
  if (warn) { ctx.fillStyle = hexA(PAL.orange, 0.5); for (let i = -1; i < 24; i++) { const sx = i * 44 + (G.frame * 2) % 44; ctx.fillRect(sx, y - 26 * k, 14, 4); ctx.fillRect(sx, y + 26 * k - 4, 14, 4); } }
  ctx.globalAlpha = 1; if (k > 0.5) text(bn.text, W / 2 + (1 - k) * 200, y, 28, col);
}
let LOGO = null;
function logo() { return LOGO || (LOGO = makeCanvas(640, 220, x => { x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = 'bold 96px "Courier New",monospace';
  for (const [s, y, c1, c2] of [['NOVA', 60, '#ffb0d0', PAL.pink], ['TETHER', 150, '#ffe08a', PAL.orange]]) {
    x.lineWidth = 12; x.strokeStyle = '#1a0a30'; x.strokeText(s, 320, y + 6); x.strokeText(s, 320, y);
    const g = x.createLinearGradient(0, y - 40, 0, y + 40); g.addColorStop(0, c1); g.addColorStop(0.55, c2); g.addColorStop(1, '#5a1040');
    x.fillStyle = g; x.fillText(s, 320, y); x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(80, y - 30, 480, 3); }
  x.globalCompositeOperation = 'destination-in'; x.fillStyle = '#000'; x.beginPath(); for (let yy = 0; yy < 220; yy += 4) x.rect(0, yy, 640, 3); x.fill(); })); } // scanline cut
function drawTitle() {
  ctx.fillStyle = 'rgba(5,6,26,.45)'; ctx.fillRect(0, 0, W, H);
  const y = 40 + Math.sin(G.frame / 30) * 4, L = logo();
  drawGlow(W / 2, y + 100, PAL.pink, 260, 0.25); ctx.drawImage(L, W / 2 - 320, y);
  const sw = (G.frame * 6) % 1400 - 200; drawGlow(W / 2 - 320 + sw, y + 100, PAL.white, 50, 0.35);     // sheen sweep
  ctx.fillStyle = PAL.lav; ctx.fillRect(W / 2 - 230, y + 205, 460, 3); ctx.fillStyle = PAL.pink; ctx.fillRect(W / 2 - 160, y + 211, 320, 2);
  // animated flyby: the ship streaks across with the Force pod chasing it
  const ft = (G.frame % 420) / 420, fx = -120 + ft * (W + 300), fy = 285 + Math.sin(ft * 9) * 12;
  drawFlame(fx - 34, fy + 1, 26, 5); ctx.drawImage(SPR.ship, fx - 36 | 0, fy - 15 | 0);
  const px = fx + 44, py = fy; drawGlow(px, py, PAL.orange, 26, 0.6); ctx.drawImage(SPR.pod, px - 20, py - 20);
  for (let i = 0; i < 6; i++) { ctx.fillStyle = hexA(PAL.cyan, 0.5 - i * 0.08); ctx.fillRect(fx - 80 - i * 30, fy - 1, 22, 2); }
  const touch = T.el.classList.contains('on');
  text(touch ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, 340, 26, G.frame % 60 < 40 ? PAL.white : PAL.cyan);
  if (touch) { text('LEFT THUMB: MOVE   FIRE: SHOOT / HOLD TO CHARGE', W / 2, 386, 16, PAL.lav); text('FORCE: LAUNCH / RECALL THE POD', W / 2, 410, 16, PAL.lav); }
  else { text('ARROWS/WASD MOVE   SPACE SHOOT (HOLD = CHARGE BEAM)', W / 2, 386, 16, PAL.lav); text('SHIFT/Z FORCE LAUNCH/RECALL   P PAUSE   M MUTE', W / 2, 410, 16, PAL.lav); }
  text('HI ' + hiScore, W / 2, 452, 18, PAL.yellow);
  text('Recall the Force from behind to dock it at the rear', W / 2, 490, 13, '#8a8fd0');
}
function render() {
  const th = BG.themes[STAGES[G.stage].theme];
  ctx.setTransform(SC, 0, 0, SC, 0, 0); ctx.save(); if (G.shake > 0) ctx.translate((vr() - .5) * G.shake | 0, (vr() - .5) * G.shake | 0);
  BG.drawBack(th);
  if (G.mode !== 'title') { drawOrbs(); drawEnemies(); for (const b of bosses) b.draw(); drawProjectiles(); drawPlayer(); if (P.alive || F.state === 'free') drawForce(); }
  drawParts(); BG.drawFore(th); ctx.restore();
  if (G.flash > 0) { ctx.fillStyle = hexA(PAL.white, G.flash * 1.6); ctx.fillRect(0, 0, W, H); }
  if (G.mode === 'title') drawTitle();
  else { drawHUD();
    if (G.mode === 'pause') { ctx.fillStyle = 'rgba(5,6,26,.6)'; ctx.fillRect(0, 0, W, H); text('PAUSED', W / 2, H / 2 - 20, 56, PAL.white); text('P / ESC / TAP TO RESUME', W / 2, H / 2 + 34, 18, PAL.lav); }
    if (G.mode === 'over') { ctx.fillStyle = 'rgba(5,6,26,.6)'; ctx.fillRect(0, 0, W, H); drawGlow(W / 2, H / 2 - 50, PAL.pink, 200, 0.3); text('GAME OVER', W / 2, H / 2 - 50, 64, PAL.pink);
      text('SCORE ' + G.score + '   HI ' + hiScore, W / 2, H / 2 + 14, 22, PAL.yellow);
      if (G.modeT > 1) text(T.el.classList.contains('on') ? 'TAP TO RETRY' : 'PRESS SPACE TO RETRY', W / 2, H / 2 + 64, 22, G.frame % 60 < 40 ? PAL.white : PAL.cyan); }
    if (G.mode === 'clear') { const k = Math.min(1, G.modeT * 3);
      ctx.fillStyle = hexA('#0b0b2e', 0.75 * k); ctx.fillRect(0, H / 2 - 70 * k, W, 140 * k); ctx.fillStyle = PAL.yellow; ctx.fillRect(0, H / 2 - 70 * k, W, 2); ctx.fillRect(0, H / 2 + 70 * k - 2, W, 2);
      drawGlow(W / 2, H / 2 - 30, PAL.yellow, 180, 0.3 * k);
      text(G.stage + 1 < STAGES.length ? 'STAGE CLEAR!' : 'MISSION COMPLETE!', W / 2, H / 2 - 30, 52, PAL.yellow); text('BONUS ' + 10000 * (G.stage + 1), W / 2, H / 2 + 26, 22, PAL.white);
      if (vr() < 0.3) spark(vr() * W, H / 2 - 70 + vr() * 140, 3, vr() < .5 ? PAL.yellow : PAL.pink, 120, 0.6, 3); }
  }
}
// ---- main loop: requestAnimationFrame + fixed-step accumulator (delta time) ----
// Per-frame cost budget: if sim+render averages > 9 ms we switch to lowFx (fewer glows/particles).
let last = performance.now(), acc = 0, costAvg = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!NV.manual) { const t0 = performance.now(); acc += dt; let n = 0; while (acc >= DT && n < 6) { step(); acc -= DT; n++; } if (n === 6) acc = 0; render();
    costAvg = costAvg * 0.95 + (performance.now() - t0) * 0.05; if (costAvg > 9) G.lowFx = true; else if (costAvg < 4) G.lowFx = false; }
  requestAnimationFrame(frame);
}

/* ---------- DEBUG / TEST API (window.NV) ---------- */
const NV = window.NV = { manual: false, god: false,
  step(n = 1) { for (let i = 0; i < n; i++) step(); }, render,
  start(o = {}) { newGame(); if (o.stage) startStage(o.stage); if (o.weapon) P.weapon = o.weapon; if (o.level) P.level = o.level; if (o.god !== undefined) this.god = o.god; },
  input(o) { Object.assign(Input, o); },
  skip(where) { // 'mini' | 'boss' : jump the timeline right before that event
    const ev = STAGES[G.stage].events; const i = ev.findIndex(e => e[1] === (where === 'mini' ? 'MINI' : 'BOSS'));
    enemies.length = 0; ebullets.length = 0; G.evIdx = i; G.stageT = ev[i][0]; },
  boss() { return bosses[0] ? { name: bosses[0].name, hp: bosses[0].hp, max: bosses[0].maxHp, phase: bosses[0].phase() } : null; },
  state() { return { mode: G.mode, stage: G.stage, t: +G.stageT.toFixed(2), score: G.score, lives: G.lives, px: +P.x.toFixed(1), py: +P.y.toFixed(1), alive: P.alive,
    weapon: P.weapon, level: P.level, charge: +P.charge.toFixed(2), force: F.state, fx: +F.x.toFixed(1), fy: +F.y.toFixed(1),
    enemies: enemies.length, shots: pshots.length, missiles: missiles.length, beams: beams.length, ebullets: ebullets.length, orbs: orbs.length, fbeam: F.beamOn,
    lowFx: G.lowFx, boss: this.boss(), bossKills: G.bossKills, hi: hiScore }; },
  G, P, F, enemies, ebullets, bosses, orbs, spawn, dropOrb, killPlayer,
};
buildBossArt(); BG.init(); F.x = P.x + 40; F.y = P.y; seed = 12345;
requestAnimationFrame(frame);
